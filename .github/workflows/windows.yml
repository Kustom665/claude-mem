name: Windows

on:
  pull_request:
    paths:
      - 'src/**'
      - 'plugin/scripts/**'
      - 'package.json'
      - 'bunfig.toml'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun (worker runtime)
        run: |
          irm bun.sh/install.ps1 | iex
        shell: pwsh

      # The runner ships Visual Studio 2026, which the node-gyp bundled with
      # npm 10 doesn't recognize, so native modules (tree-sitter grammars) fail
      # to compile. npm 11 bundles node-gyp 12.4+, which supports VS 2026.
      # npm 10 ignores npm_config_node_gyp, so the npm upgrade is required.
      - name: Upgrade npm for a node-gyp that recognizes Visual Studio 2026
        run: |
          npm install -g npm@11
          npm prefix -g | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify npm 11 is active
        run: |
          $v = npm --version
          Write-Output "npm $v"
          if (-not $v.StartsWith('11.')) { throw "expected npm 11, got $v" }
        shell: pwsh

      - run: npm install --no-audit --no-fund

      # Build only — the build-and-sync script also runs marketplace sync + worker
      # restart from a hardcoded ~/.claude/plugins path that doesn't exist on CI.
      - run: npm run build
