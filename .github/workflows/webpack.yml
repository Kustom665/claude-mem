name: Build (Node matrix)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        # package.json declares engines.node >= 20.0.0, so those are the
        # versions worth proving. ci.yml builds on 20 only; this adds 22.
        node-version: ['20', '22']

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - run: npm install --no-audit --no-fund

    # Build only, as in windows.yml: build-and-sync also runs the marketplace
    # sync and a worker restart from a hardcoded ~/.claude/plugins path that
    # doesn't exist on CI.
    #
    # Bun is deliberately not installed here. gen-plugin-lockfile.cjs skips
    # regeneration when bun is off PATH, so this job covers the node-only
    # build path — the one a contributor hits before installing bun.
    - run: npm run build
