/* ══ Tokens ═══════════════════════════════════════════════════════════════ */
:root{
  --sand:#DEE0D8; --sand-2:#D4D7CD;
  --groove:#ADB3A4; --lip:#EFF1EA; --ripple:rgba(23,30,39,.055);
  --ink:#171E27; --muted:#5C6675; --line:#C3C7BB;
  --panel:rgba(238,239,233,.86); --panel-edge:rgba(23,30,39,.10);
  --brass:#7A5E22; --brass-lit:#96762F; --on-brass:#F5F4EF;
  --stone:#8C9288; --stone-hi:#A3A89D; --stone-sh:rgba(23,30,39,.22);
  --moss:rgba(78,107,80,.18);
  --grain:.030;
  --shadow:0 2px 6px rgba(23,30,39,.07), 0 16px 40px -20px rgba(23,30,39,.35);

  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --sand:#131A23; --sand-2:#0F151D;
    --groove:#080C12; --lip:#313E4D; --ripple:rgba(231,227,216,.05);
    --ink:#E7E3D8; --muted:#8A93A2; --line:#2A3441;
    --panel:rgba(20,27,36,.84); --panel-edge:rgba(231,227,216,.13);
    --brass:#C9A661; --brass-lit:#E0BE79; --on-brass:#10151C;
    --stone:#0C1219; --stone-hi:#222D3A; --stone-sh:rgba(0,0,0,.6);
    --moss:rgba(126,160,126,.14);
    --grain:.055;
    --shadow:0 2px 6px rgba(0,0,0,.45), 0 18px 46px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="light"]{
  --sand:#DEE0D8; --sand-2:#D4D7CD;
  --groove:#ADB3A4; --lip:#EFF1EA; --ripple:rgba(23,30,39,.055);
  --ink:#171E27; --muted:#5C6675; --line:#C3C7BB;
  --panel:rgba(238,239,233,.86); --panel-edge:rgba(23,30,39,.10);
  --brass:#7A5E22; --brass-lit:#96762F; --on-brass:#F5F4EF;
  --stone:#8C9288; --stone-hi:#A3A89D; --stone-sh:rgba(23,30,39,.22);
  --moss:rgba(78,107,80,.18);
  --grain:.030;
  --shadow:0 2px 6px rgba(23,30,39,.07), 0 16px 40px -20px rgba(23,30,39,.35);
}
:root[data-theme="dark"]{
  --sand:#131A23; --sand-2:#0F151D;
  --groove:#080C12; --lip:#313E4D; --ripple:rgba(231,227,216,.05);
  --ink:#E7E3D8; --muted:#8A93A2; --line:#2A3441;
  --panel:rgba(20,27,36,.84); --panel-edge:rgba(231,227,216,.13);
  --brass:#C9A661; --brass-lit:#E0BE79; --on-brass:#10151C;
  --stone:#0C1219; --stone-hi:#222D3A; --stone-sh:rgba(0,0,0,.6);
  --moss:rgba(126,160,126,.14);
  --grain:.055;
  --shadow:0 2px 6px rgba(0,0,0,.45), 0 18px 46px -20px rgba(0,0,0,.8);
}

/* ══ Base ═════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--sand); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
:focus-visible{outline:2px solid var(--brass-lit);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#garden{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
body[data-mode="stones"] #garden{cursor:pointer}

.layer{position:fixed;inset:0;pointer-events:none;z-index:1;padding:clamp(.9rem,2.4vw,1.6rem)}
.layer > *{pointer-events:auto}

/* ── Crest ───────────────────────────────────────────────────────────────── */
.crest{position:absolute;top:clamp(.9rem,2.4vw,1.6rem);left:clamp(.9rem,2.4vw,1.6rem);
  display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.crest .mark{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.7rem);letter-spacing:.12em;line-height:1}
.crest .rom{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.crest .ver{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.16em;color:var(--brass);
  border:1px solid var(--line);border-radius:1px;padding:.1rem .34rem}

/* ── Stats ───────────────────────────────────────────────────────────────── */
.stats{position:absolute;top:clamp(.9rem,2.4vw,1.6rem);right:clamp(.9rem,2.4vw,1.6rem);
  display:flex;gap:clamp(.9rem,2.4vw,1.7rem);text-align:right}
.stat{display:flex;flex-direction:column;gap:.1rem}
.stat .k{font-family:var(--f-mono);font-size:.575rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:34rem){ .stats{display:none} }

/* ── Console ─────────────────────────────────────────────────────────────── */
/* The hint rides inside the console as a full-width first row, so it stays
   glued to the controls it describes at every width. */
.hint{
  flex-basis:100%;margin:0 0 .1rem;
  font-size:.8125rem;color:var(--muted);text-align:center;
  transition:opacity .5s ease;
}
.console{
  position:absolute;left:50%;bottom:clamp(.9rem,2.4vw,1.6rem);transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:.4rem .55rem; padding:.5rem .6rem; max-width:min(96vw,60rem);
  background:var(--panel); border:1px solid var(--panel-edge); border-radius:3px;
  box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.grp{display:flex;align-items:center;gap:.3rem}
.grp-k{
  font-family:var(--f-mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding-right:.15rem;white-space:nowrap;
}
.sep{width:1px;align-self:stretch;background:var(--panel-edge);margin:.1rem .15rem}
@media (max-width:52rem){ .sep{display:none} .console{gap:.35rem .45rem} }

.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-body);font-size:.75rem;font-weight:500;letter-spacing:.01em;
  padding:.36rem .62rem;border:0;background:none;color:var(--muted);cursor:pointer;
  transition:background .18s,color .18s;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass)}
.seg button .k{font-family:var(--f-display);font-size:.85rem;margin-right:.28rem}

.act{
  font-family:var(--f-body);font-size:.75rem;font-weight:500;
  padding:.4rem .7rem;border:1px solid var(--line);border-radius:2px;
  background:none;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:color .18s,border-color .18s;
}
.act:hover{color:var(--brass);border-color:var(--brass)}
.act[aria-pressed="true"]{color:var(--brass);border-color:var(--brass)}
.act:disabled{opacity:.42;cursor:default}
.act:disabled:hover{color:var(--muted);border-color:var(--line)}

.toast{
  position:fixed;left:50%;bottom:clamp(5.5rem,14vh,7.5rem);transform:translate(-50%,60%);
  background:var(--ink);color:var(--sand);border-radius:2px;padding:.5rem 1rem;

  /* ── clip marks so furrows stop at the stones ─────────────────────────── */

        stones.push(makeStone(p.x, p.y, r, (Math.random() * 1e9) | 0));

      } else if (dragging) {

  /* ══ controls ═════════════════════════════════════════════════════════ */

  }

  $("mode").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mode]"); if (!b) return;
    mode = b.dataset.mode;
    document.body.dataset.mode = mode;
    press("mode", "mode", mode);

  $("tines").addEventListener("click", function (e) {

  });

  });

    stopAndClear(); seedStones(); refreshStats(); compose(); toast("Garden reset.");
  });

  /* ══ sound: rake hiss from filtered noise, stone set as a low thud ═════ */

    if (on) audio.thud(0.9);
  });

  /* ══ save ═════════════════════════════════════════════════════════════ */
  $("save").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    cv.toBlob(function (blob) {
      if (!blob) { btn.disabled = false; toast("The image could not be made."); return; }
      var name = "ghosting-garden.png";
      var done = function (msg) { btn.disabled = false; toast(msg); };

      if (window.claude && window.claude.downloads) {
        window.claude.downloads.save({ filename: name, data: blob }).then(
          function () { done("Garden saved."); },
          function (err) {
            var code = err && err.code;
            if (code === "declined") done("Save cancelled.");
            else if (code === "rate_limited") done("A save is already open — try again in a moment.");
            else done("Saving is not available here.");
          }
        );
        return;
      }
      try {                                             // plain page / local file
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        done("Garden saved.");
      } catch (err) { done("Saving is not available here."); }
    }, "image/png");
  });

  /* ══ lifetime counter (this browser only) ═════════════════════════════ */
  var store = (function () {
    try { localStorage.setItem("__gg", "1"); localStorage.removeItem("__gg"); return localStorage; }
    catch (err) { return null; }
  })();
  var lifetime = 0;
  if (store) { lifetime = parseInt(store.getItem("gg.strokes") || "0", 10) || 0; }
  function saveLifetime() {
    if (store) { try { store.setItem("gg.strokes", String(lifetime + strokeCount)); } catch (err) {} }
  }

  var started = Date.now();
  setInterval(function () {
    var t = Math.floor((Date.now() - started) / 1000);
    var m = Math.floor(t / 60), s = t % 60;
    $("s-time").textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }, 1000);

  /* ══ opening arrangement ══════════════════════════════════════════════ */
  function seedStones() {
    var u = Math.sqrt(W * H);
    stones = [
      makeStone(W * 0.24, H * 0.44, u * 0.075, 11),
      makeStone(W * 0.32, H * 0.56, u * 0.042, 22),
      makeStone(W * 0.175, H * 0.60, u * 0.029, 33),
      makeStone(W * 0.74, H * 0.62, u * 0.066, 44),
      makeStone(W * 0.815, H * 0.70, u * 0.034, 55)
    ];
  }

  // one self-drawing stroke on load, so the gesture is obvious without a label
  function demoStroke() {
    if (reduce.matches) return;
    var pts = [], i, t;
    for (i = 0; i <= 70; i++) {
      t = i / 70;
      pts.push({
        x: W * (0.10 + t * 0.80),
        y: H * 0.30 + Math.sin(t * Math.PI * 1.7) * H * 0.10
      });
    }
    var k = 1;
    (function step() {
      if (k >= pts.length) { strokeCount++; refreshStats(); wake(); return; }
      carve(pts[k - 1].x, pts[k - 1].y, pts[k].x, pts[k].y);
      compose();
      k += 2;
      requestAnimationFrame(step);
    })();
  }

  /* ══ theme + resize ═══════════════════════════════════════════════════ */
  function onTheme() { readTokens(); buildBase(); compose(); }
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(onTheme);
  }
  new MutationObserver(onTheme).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-theme"] });

  var rz = null;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { layout(true); }, 150);
  });
  window.addEventListener("pagehide", saveLifetime);
  document.addEventListener("visibilitychange", function () { if (document.hidden) saveLifetime(); });

  /* ══ go ═══════════════════════════════════════════════════════════════ */
  document.body.dataset.mode = "rake";
  readTokens();
  layout(false);
  seedStones();
  refreshStats();
  compose();
  demoStroke();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { compose(); });
})();
</script>
